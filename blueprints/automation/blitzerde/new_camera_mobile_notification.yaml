blueprint:
  name: "Blitzer.de – New camera nearby"
  description: >-
    Send a Home Assistant Companion App notification when Blitzer.de reports
    a new camera within the configured maximum distance. The integration's
    new-report window controls which reports are marked as new.
  domain: automation
  source_url: https://github.com/abderlahmanalhnedi/hass-blitzerde/blob/main/blueprints/automation/blitzerde/new_camera_mobile_notification.yaml
  author: Abderlahman Al Hnedi
  input:
    notify_device:
      name: Device to notify
      description: Device running the official Home Assistant Companion App.
      selector:
        device:
          filter:
            integration: mobile_app
    max_distance:
      name: Maximum distance
      description: Ignore new reports farther away than this distance.
      default: 5
      selector:
        number:
          min: 0.1
          max: 50
          step: 0.1
          unit_of_measurement: km
          mode: slider
    area_name:
      name: Area / route name (optional)
      description: >-
        Leave empty to accept every configured Blitzer.de entry, or enter the
        exact display name of one configured area/route.
      default: ""
      selector:
        text:

triggers:
  - trigger: event
    event_type: blitzerde_new_camera

variables:
  max_distance: !input max_distance
  area_name: !input area_name
  report_distance: "{{ trigger.event.data.distance_km | float(9999) }}"
  report_area: "{{ trigger.event.data.area | default('') }}"
  report_summary: >-
    {{ trigger.event.data.summary
       | default(trigger.event.data.street
       | default('New speed camera')) }}

conditions:
  - condition: template
    value_template: >-
      {{ report_distance <= (max_distance | float)
         and (area_name | trim == '' or report_area == area_name) }}

actions:
  - alias: Notify mobile device
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "Blitzer.de · {{ report_area }}"
    message: >-
      {{ report_summary }} · {{ report_distance | round(1) }} km
      {% if trigger.event.data.vmax not in [none, '', '?', '/'] %}
      · {{ trigger.event.data.vmax }} km/h
      {% endif %}

mode: queued
max: 10
