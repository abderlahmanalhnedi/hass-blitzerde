name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, for example 1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/blitzerde/manifest.json").read_text()
          )
          expected = os.environ["VERSION"]
          actual = manifest["version"]
          if actual != expected:
              raise SystemExit(
                  f"manifest version {actual!r} does not match requested release {expected!r}"
              )
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Package integration
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cd custom_components
          zip -r "../dist/blitzerde-v${VERSION}.zip" blitzerde

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Blitzer.de v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}"             "dist/blitzerde-v${VERSION}.zip"             --title "Blitzer.de v${VERSION}"             --generate-notes
