name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, for example 1.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce HACS Default validation mode
        run: |
          if grep -Eq '^[[:space:]]*ignore:' .github/workflows/action.yaml; then
            echo "::error::HACS validation still ignores one or more checks."
            echo "::error::Resolve the readiness blockers and remove every ignore before releasing."
            exit 1
          fi

      - name: Validate HACS repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" > /tmp/repo.json
          python - <<'PY'
          import json
          from pathlib import Path

          repo = json.loads(Path("/tmp/repo.json").read_text())

          if not repo.get("has_issues"):
              raise SystemExit("GitHub Issues must be enabled before release")

          topics = repo.get("topics") or []
          if not topics:
              raise SystemExit("At least one GitHub repository topic is required before release")

          license_info = repo.get("license") or {}
          spdx_id = license_info.get("spdx_id")
          if not spdx_id or spdx_id == "NOASSERTION":
              raise SystemExit(
                  "A provenance-safe repository license with a detectable SPDX ID is required"
              )
          PY

      - name: Validate manifest version and brand assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/blitzerde/manifest.json").read_text()
          )
          expected = os.environ["VERSION"]
          actual = manifest["version"]
          if actual != expected:
              raise SystemExit(
                  f"manifest version {actual!r} does not match requested release {expected!r}"
              )

          required_assets = (
              Path("custom_components/blitzerde/brand/icon.png"),
              Path("custom_components/blitzerde/brand/icon@2x.png"),
          )
          missing = [str(path) for path in required_assets if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required brand assets: {', '.join(missing)}")
          PY

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip check

      - name: Run release test suite
        run: python -m pytest -q tests

      - name: Package integration
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          cd custom_components
          zip -r "../dist/blitzerde-v${VERSION}.zip" blitzerde

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Blitzer.de v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            "dist/blitzerde-v${VERSION}.zip" \
            --title "Blitzer.de v${VERSION}" \
            --generate-notes
