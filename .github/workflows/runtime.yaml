name: Home Assistant runtime

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: HA 2026.9 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip check

      - name: Show Home Assistant version
        run: |
          python - <<'PY'
          import importlib.metadata
          print("Home Assistant:", importlib.metadata.version("homeassistant"))
          print(
              "pytest-homeassistant-custom-component:",
              importlib.metadata.version("pytest-homeassistant-custom-component"),
          )
          PY

      - name: Run Home Assistant runtime tests
        run: >-
          python -m pytest -q
          tests/test_api.py
          tests/test_config_flow.py
          tests/test_runtime.py
          --cov=custom_components.blitzerde
          --cov-report=term-missing
