name: Code quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components/blitzerde
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check custom_components/blitzerde
      - name: Validate dashboard card JavaScript
        run: node --check custom_components/blitzerde/frontend/blitzerde-card.js
