name: Python quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Syntax and Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components/blitzerde
      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check custom_components/blitzerde
